# Rendered only by bridge-entrypoint; do not load this template directly.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # No request URLs, query strings, headers or bodies in access logs.
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    # njs 0.9.6 enforces Content-Length at 1 MiB, but its chunked parser can
    # buffer up to 10 MiB before rejecting. JS rejects every decoded body >1 MiB.
    # Four global in-flight API requests bound aggregate chunked buffering to
    # approximately 40 MiB plus per-fetch read buffers (Compose mem_limit: 256m).
    js_fetch_max_response_buffer_size 1m;
    js_fetch_timeout 30s;

    limit_conn_zone $binary_remote_addr zone=bridge_clients:1m;
    limit_conn_zone $server_name zone=bridge_global:1m;
    limit_conn_status 429;
    send_timeout 30s;

    js_path /etc/nginx/njs/;
    js_import transform.js;

    server {
        listen 8080;
        server_name _;
        # The entrypoint resolves UPSTREAM_HOST once via getent and substitutes
        # the validated IPv4 address. Keep the original host for HTTP Host.
        set $upstream_host "$UPSTREAM_HOST";
        set $upstream_models_url "http://$UPSTREAM_IP:$UPSTREAM_PORT/models/list";
        set $upstream_chat_url "http://$UPSTREAM_IP:$UPSTREAM_PORT/inference/chat_completion";

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /v1/models {
            default_type application/json;
            limit_conn bridge_global 4;
            limit_conn bridge_clients 8;
            js_content transform.transform_models;
        }
        location = /models {
            default_type application/json;
            limit_conn bridge_global 4;
            limit_conn bridge_clients 8;
            js_content transform.transform_models;
        }
        location = /v1/chat/completions {
            default_type application/json;
            limit_conn bridge_global 4;
            limit_conn bridge_clients 8;
            js_content transform.transform_chat_completion;
        }
        location = /chat/completions {
            default_type application/json;
            limit_conn bridge_global 4;
            limit_conn bridge_clients 8;
            js_content transform.transform_chat_completion;
        }
        location / {
            return 404;
        }
    }
}
