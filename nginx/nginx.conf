# Rendered only by bridge-entrypoint; do not load this template directly.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # No request URLs, query strings, headers or bodies in access logs.
    access_log off;
    server_tokens off;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path /tmp/nginx_proxy;
    # Keep proxy response buffering in memory; no uncontrolled temp-file spill.
    # These are per-request bounds, not a hard total wall-clock deadline.
    subrequest_output_buffer_size 1m;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 4 16k;
    proxy_busy_buffers_size 32k;
    proxy_max_temp_file_size 0;
    proxy_request_buffering on;
    limit_conn_zone $binary_remote_addr zone=bridge_clients:1m;
    limit_conn_status 429;
    send_timeout 30s;

    js_path /etc/nginx/njs/;
    js_import transform.js;

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /__upstream_models {
            internal;
            proxy_pass http://$UPSTREAM_HOST:$UPSTREAM_PORT/models/list;
            proxy_pass_request_headers off;
            proxy_set_header Host $UPSTREAM_HOST;
            proxy_set_header Accept application/json;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location = /__upstream_chat {
            internal;
            proxy_pass http://$UPSTREAM_HOST:$UPSTREAM_PORT/inference/chat_completion;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host $UPSTREAM_HOST;
            proxy_set_header Content-Type application/json;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 30s;
        }

        location = /v1/models {
            default_type application/json;
            limit_conn bridge_clients 8;
            js_content transform.transform_models;
        }
        location = /models {
            default_type application/json;
            limit_conn bridge_clients 8;
            js_content transform.transform_models;
        }
        location = /v1/chat/completions {
            default_type application/json;
            limit_conn bridge_clients 8;
            js_content transform.transform_chat_completion;
        }
        location = /chat/completions {
            default_type application/json;
            limit_conn bridge_clients 8;
            js_content transform.transform_chat_completion;
        }
        location / {
            return 404;
        }
    }
}
