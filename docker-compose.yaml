services:
  llama-stack-bridge:
    build: ./nginx
    # Loopback only: do not expose unprotected LLM traffic to LAN/WAN.
    ports:
      - "127.0.0.1:42070:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    user: nginx
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: "no"
